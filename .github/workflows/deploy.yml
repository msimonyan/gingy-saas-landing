name: Deploy Next.js landing to VPS

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          echo "🔐 Setting up SSH..."
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "🔎 Checking SSH key..."
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          echo "✅ SSH setup complete."

      - name: Deploy to Server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "🚀 Deploying landing branch '$BRANCH' to $DEPLOY_HOST..."
          echo "🔎 Expected environment: $([[ "$BRANCH" == "main" ]] && echo "prod" || echo "dev")"

          ssh -i ~/.ssh/id_ed25519 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$DEPLOY_USER@$DEPLOY_HOST" "BRANCH='$BRANCH' bash -s" <<'ENDSSH'
              set -euo pipefail

              echo "🖥️ Remote hostname:"
              hostname

              echo "📦 Loading Node/NVM..."
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
              nvm use 20

              echo "📁 Navigating to landing directory..."
              cd /var/www/gingy-landing

              echo "📥 Fetching and resetting to latest code from Git..."
              git fetch origin "$BRANCH"
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git reset --hard "origin/$BRANCH"

              echo "🧠 Ensuring 4G swap exists..."
              SWAP_SIZE_BYTES=$(stat -c%s /swapfile 2>/dev/null || echo 0)

              if [ "$SWAP_SIZE_BYTES" -lt 4294967296 ]; then
                sudo swapoff /swapfile 2>/dev/null || true
                sudo rm -f /swapfile
                sudo fallocate -l 4G /swapfile
                sudo chmod 600 /swapfile
                sudo mkswap /swapfile
                sudo swapon /swapfile
              fi

              echo "🧠 Current memory/swap:"
              free -h

              echo "🛑 Stopping PM2 app during build to free memory..."
              pm2 stop gingy-landing || true

              echo "🧹 Cleaning old Next build cache..."
              rm -rf .next/cache

              echo "📦 Installing dependencies..."
              NODE_OPTIONS="--max-old-space-size=768" npm ci --no-audit --no-fund

              echo "🏗️ Building landing..."
              NODE_OPTIONS="--max-old-space-size=768" npm run build

              echo "🔄 Restarting PM2..."
              if pm2 describe gingy-landing > /dev/null 2>&1; then
                pm2 restart gingy-landing --update-env
              else
                pm2 start npm --name gingy-landing --cwd /var/www/gingy-landing -- start
              fi

              pm2 save

              echo "🔁 Reloading Nginx..."
              sudo systemctl reload nginx

              echo "✅ Landing deployment finished successfully!"
          ENDSSH

      - name: Notify success
        if: success()
        run: echo "✅ Landing deployed successfully!"

      - name: Notify failure
        if: failure()
        run: echo "❌ Landing deployment failed!"